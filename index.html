// otherwise the site defaults to dark. Kept in sync by src/lib/theme.js.
(function () {
  var t;
  try { t = localStorage.getItem("sheetshift-theme"); } catch (e) {}
  document.documentElement.dataset.theme = (t === "light" || t === "dark") ? t : "dark";
})();
</script>
